name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Monday at 5:17 AM UTC ->> 8:17 AM EEST
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        BASE_URL: https://www.saucedemo.com/
        SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      run: npm test
    - name: Generate Summary Report
      if: ${{ !cancelled() }}
      run: node utils/generate-summary.js
    - name: Add Job Summary
      if: ${{ !cancelled() }}
      run: cat playwright-report/summary.md >> $GITHUB_STEP_SUMMARY
    - name: Post PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: always() && github.event_name == 'pull_request'
      with:
        path: playwright-report/summary.md
    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ !cancelled() }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        